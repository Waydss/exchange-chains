basePath: /
definitions:
  cb.BarterReadDTO:
    properties:
      from_user_id:
        type: integer
      give:
        $ref: '#/definitions/cb.GiveReadDTO'
      id:
        type: integer
      position:
        type: integer
      status:
        type: string
      to_user_id:
        type: integer
      wish:
        $ref: '#/definitions/cb.WishReadDTO'
    type: object
  cb.ChainReadDTO:
    properties:
      barters:
        items:
          $ref: '#/definitions/cb.BarterReadDTO'
        type: array
      created_at:
        type: string
      id:
        type: integer
      root_id:
        type: integer
      root_wish:
        $ref: '#/definitions/cb.WishReadDTO'
      score:
        type: number
      signature:
        type: string
      status:
        type: string
    type: object
  cb.GiveReadDTO:
    properties:
      category_id:
        type: integer
      id:
        type: integer
      price_max:
        type: integer
      price_min:
        type: integer
      status:
        type: string
      title:
        type: string
      user_id:
        type: integer
    type: object
  cb.ListChainsResponse:
    properties:
      chains:
        items:
          $ref: '#/definitions/cb.ChainReadDTO'
        type: array
    type: object
  cb.WishReadDTO:
    properties:
      category_id:
        type: integer
      id:
        type: integer
      price_max:
        type: integer
      price_min:
        type: integer
      title_keywords:
        type: string
      user_id:
        type: integer
    type: object
  httpserver.ErrorDetail:
    properties:
      code:
        example: validation_error
        type: string
      message:
        example: request body must be valid JSON
        type: string
    type: object
  httpserver.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/httpserver.ErrorDetail'
    type: object
  item.CategoryResponse:
    properties:
      id:
        example: 1
        type: integer
      name:
        example: Гитары
        type: string
    type: object
  item.Condition:
    enum:
    - new
    - like_new
    - good
    - fair
    - poor
    type: string
    x-enum-varnames:
    - ConditionNew
    - ConditionLikeNew
    - ConditionGood
    - ConditionFair
    - ConditionPoor
  item.CreateResponse:
    properties:
      category:
        $ref: '#/definitions/item.CategoryResponse'
      condition:
        allOf:
        - $ref: '#/definitions/item.Condition'
        example: good
      created_at:
        example: "2026-08-05T15:00:00Z"
        type: string
      description:
        example: Исправна, есть небольшие царапины
        type: string
      id:
        example: 101
        type: integer
      photos:
        items:
          $ref: '#/definitions/item.PhotoResponse'
        type: array
      price_max:
        example: 50000
        type: integer
      price_min:
        example: 40000
        type: integer
      status:
        allOf:
        - $ref: '#/definitions/item.Status'
        example: searching
      title:
        example: Гитара Yamaha F310, 6 струн
        type: string
      wanted_category:
        $ref: '#/definitions/item.CategoryResponse'
    type: object
  item.PhotoResponse:
    properties:
      id:
        example: 501
        type: integer
      url:
        example: /uploads/items/101/7d9f03c7.webp
        type: string
    type: object
  item.Status:
    enum:
    - searching
    - in_chain
    - reserved
    - in_transit
    - exchanged
    - archived
    type: string
    x-enum-varnames:
    - StatusSearching
    - StatusInChain
    - StatusReserved
    - StatusInTransit
    - StatusExchanged
    - StatusArchived
  rejection.DeclineChainRequest:
    properties:
      received_item_id:
        example: 205
        type: integer
    type: object
  rejection.DeclineChainResponse:
    properties:
      chain_id:
        example: 77
        type: integer
      received_item_id:
        example: 205
        type: integer
      status:
        example: rejection_recorded
        type: string
    type: object
  user.AuthResult:
    properties:
      access_token:
        example: <jwt_access_token>
        type: string
      expires_in:
        example: 86400
        type: integer
      token_type:
        example: Bearer
        type: string
      user:
        $ref: '#/definitions/user.PublicUser'
    type: object
  user.LoginRequest:
    properties:
      login:
        example: vadim
        type: string
      password:
        example: example-password
        type: string
    required:
    - login
    - password
    type: object
  user.PublicUser:
    properties:
      created_at:
        example: "2026-08-04T12:00:00Z"
        type: string
      id:
        example: 1
        type: integer
      login:
        example: vadim
        type: string
      name:
        example: vadim
        type: string
      public_rating:
        example: 0
        type: number
    type: object
  user.RegisterRequest:
    properties:
      login:
        example: vadim
        maxLength: 32
        minLength: 3
        type: string
      name:
        example: Вадим
        maxLength: 100
        minLength: 2
        type: string
      password:
        example: example-password
        minLength: 8
        type: string
    required:
    - login
    - name
    - password
    type: object
host: localhost:8080
info:
  contact:
    email: grigorevvadim875@yandex.ru
    name: Grigorev Vadim
  description: Backend API РїСЂРѕРµРєС‚Р° В«Р¦РµРїРѕС‡РєР° РѕР±РјРµРЅР°В».
  title: Exchange Chain API
  version: "1.0"
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Проверяет логин и пароль и возвращает публичный профиль с JWT-токеном
        доступа.
      parameters:
      - description: Учётные данные
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/user.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.AuthResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
      summary: Вход пользователя
      tags:
      - auth
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: Создаёт пользователя с обязательным именем и возвращает публичный
        профиль с JWT-токеном доступа.
      parameters:
      - description: Данные для регистрации
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/user.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/user.AuthResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
      summary: Регистрация пользователя
      tags:
      - auth
  /api/v1/chain:
    post:
      consumes:
      - application/json
      description: Ставит запрос на построение цепочек обмена для указанного желания
        в очередь. Проверяет существование аккаунта и принадлежность желания этому
        аккаунту, затем отвечает 202 Accepted; построение выполняется асинхронно воркерами
        Service, результат пишется в БД по мере нахождения цепей.
      parameters:
      - description: Идентификатор пользователя
        in: body
        name: user_id
        required: true
        schema:
          type: integer
      - description: Идентификатор желания
        in: body
        name: wished_item_id
        required: true
        schema:
          type: integer
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Запуск построения цепочек для желания
      tags:
      - chains
  /api/v1/chains:
    get:
      description: Возвращает все цепочки обмена с вложенными бартерами.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/cb.ListChainsResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
      summary: Список цепочек
      tags:
      - chains
  /api/v1/chains/{chainId}/decline:
    post:
      consumes:
      - application/json
      description: Фиксирует в Redis временный отказ текущего пользователя от товара,
        который он должен был получить. Состояние цепочки в PostgreSQL пока не изменяется.
      parameters:
      - description: ID цепочки
        in: path
        name: chainId
        required: true
        type: integer
      - description: Получаемый товар, вызвавший отказ
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/rejection.DeclineChainRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rejection.DeclineChainResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Отказ от цепочки обмена
      tags:
      - chains
  /api/v1/chains/by-item:
    get:
      description: Возвращает цепочки обмена, построенные для указанного желания пользователя.
        Идентификаторы передаются как query-параметры user_id и wished_item_id.
      parameters:
      - description: Идентификатор пользователя
        in: query
        name: user_id
        required: true
        type: integer
      - description: Идентификатор желания
        in: query
        name: wished_item_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/cb.ListChainsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
      summary: Цепочки для желания
      tags:
      - chains
  /api/v1/chains/by-user:
    get:
      description: Возвращает цепочки обмена, в которых пользователь является корневым
        участником или участником бартера. Идентификатор передаётся как query-параметр
        user_id.
      parameters:
      - description: Идентификатор пользователя
        in: query
        name: user_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/cb.ListChainsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
      summary: Цепочки пользователя
      tags:
      - chains
  /api/v1/items:
    post:
      consumes:
      - multipart/form-data
      description: Создаёт предмет текущего пользователя и сохраняет до пяти фотографий.
      parameters:
      - description: Название предмета
        in: formData
        name: title
        required: true
        type: string
      - description: Описание предмета
        in: formData
        name: description
        type: string
      - description: Состояние
        enum:
        - new
        - like_new
        - good
        - fair
        - poor
        in: formData
        name: condition
        required: true
        type: string
      - description: Категория предмета
        in: formData
        name: category_name
        required: true
        type: string
      - description: Минимальная цена в рублях
        in: formData
        name: price_min
        required: true
        type: integer
      - description: Максимальная цена в рублях
        in: formData
        name: price_max
        required: true
        type: integer
      - description: Желаемая категория обмена
        in: formData
        name: wanted_category_name
        required: true
        type: string
      - collectionFormat: multi
        description: Фотографии JPEG, PNG или WEBP
        in: formData
        items:
          type: file
        name: photos
        type: array
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/item.CreateResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Создание предмета
      tags:
      - items
  /api/v1/me:
    get:
      description: Возвращает публичные данные пользователя из JWT-токена.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.PublicUser'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpserver.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Профиль текущего пользователя
      tags:
      - users
schemes:
- http
securityDefinitions:
  BearerAuth:
    description: 'Р’РІРµРґРёС‚Рµ С‚РѕРєРµРЅ РІ С„РѕСЂРјР°С‚Рµ: Bearer <access_token>'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
